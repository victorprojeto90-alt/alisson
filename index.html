<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AMBISAFE | Gestão Florestal Inteligente</title>
    <meta name="description" content="Plataforma SaaS para inventário florestal inteligente com IA, fitossociologia automática e relatórios técnicos." />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- App instalável -->
    <meta name="theme-color" content="#00420d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AMBISAFE" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <style>
      /* Tela de abertura (aparece antes do app carregar) */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: radial-gradient(circle at 50% 40%, #0b5a1c 0%, #00420d 55%, #002a08 100%);
        transition: opacity .45s ease, visibility .45s ease;
      }
      #splash.hide { opacity: 0; visibility: hidden; }
      #splash .mark {
        width: 112px; height: 112px; border-radius: 28px; background: #00420d; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 12px 40px rgba(0,0,0,.35), 0 0 0 1px rgba(172,209,21,.25);
        animation: splash-in .7s cubic-bezier(.2,.9,.3,1.2) both;
      }
      #splash .mark img { width: 112px; height: 112px; border-radius: 28px; animation: splash-breathe 1.8s ease-in-out .7s infinite; }
      #splash .name {
        color: #fff; font: 800 26px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; letter-spacing: 3px;
        animation: splash-up .6s ease .25s both;
      }
      #splash .name b { color: #acd115; }
      #splash .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; animation: splash-up .6s ease .4s both; }
      #splash .bar::after { content: ''; display: block; width: 40%; height: 100%; background: #acd115; border-radius: 3px; animation: splash-load 1.1s ease-in-out infinite; }
      @keyframes splash-in { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }
      @keyframes splash-up { from { transform: translateY(12px); opacity: 0 } to { transform: none; opacity: 1 } }
      @keyframes splash-breathe { 50% { transform: scale(1.06) } }
      @keyframes splash-load { 0% { transform: translateX(-100%) } 100% { transform: translateX(260%) } }
    </style>
  </head>

  <body>
    <div id="splash" aria-hidden="true">
      <div class="mark"><img src="/icons/icon-192.png" alt="" /></div>
      <div class="name">AMBI<b>SAFE</b></div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
